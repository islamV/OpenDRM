name: Core backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: disposable-ci-database
          POSTGRES_DB: openshield_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-database@127.0.0.1:5432/openshield_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - run: sh infrastructure/setup-media.sh
      - run: docker compose up -d --build --wait
      - run: python3 tests/media-smoke.py
      - name: Test ClearKey playback in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/openshield-browser" --ignore-scripts playwright@1.62.1
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/openshield-browser/node_modules/playwright"
          export CHROMIUM_PATH="$(command -v google-chrome)"
          python3 tests/playback-smoke.py
      - if: always()
        run: docker compose down -v
