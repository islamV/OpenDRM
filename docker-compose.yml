services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openshield
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate a hex DB_PASSWORD}
      RUNTIME_PASSWORD: ${API_DB_PASSWORD:?Generate a hex API_DB_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
      - ./infrastructure/init-runtime.sh:/docker-entrypoint-initdb.d/01-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d openshield"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    command: ["node","dist/migrate.js"]
    environment:
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Run sh infrastructure/setup-media.sh}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db/openshield
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://shield_api:${API_DB_PASSWORD}@db/openshield
      HOST: 0.0.0.0
    volumes:
      - input:/media/input
    ports: ["127.0.0.1:${API_PORT:-18321}:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://shield_worker:${WORKER_DB_PASSWORD}@db/openshield
      MEDIA_KEK: ${MEDIA_KEK:?Run sh infrastructure/setup-media.sh}
    volumes:
      - input:/media/input:ro
      - output:/media/output
    depends_on:
      api: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 768m
volumes:
  input:
  output:
  data:
